<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070A"/>
      <stop offset="50%" stop-color="#0E0E14"/>
      <stop offset="100%" stop-color="#14141E"/>
    </linearGradient>

    <radialGradient id="redGlow" cx="22%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="82%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF3B30" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#redGlow)"/>
  <rect width="1280" height="640" fill="url(#cyanGlow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>

    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="5" fill="#FF3B30"/>

  <!-- Left: Logo Card -->
  <g transform="translate(140, 180)" filter="url(#cardShadow)">
    <rect width="250" height="250" rx="44" fill="#FFFFFF" stroke="#FF3B30" stroke-width="3" stroke-opacity="0.4"/>
    <!-- Chevron -->
    <path fill="#000000" d="M 60,70 L 84,70 L 134,125 L 84,180 L 60,180 L 110,125 Z"/>
    <!-- Underscore -->
    <path fill="#000000" d="M 148,166 H 212 V 180 H 148 Z"/>
  </g>

  <!-- Right: Content -->
  <g transform="translate(440, 190)">
    <!-- Top Status Pills -->
    <g transform="translate(0, 0)">
      <rect width="130" height="30" rx="15" fill="#FF3B30" fill-opacity="0.15" stroke="#FF3B30" stroke-width="1.5"/>
      <text x="65" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#FF3B30" text-anchor="middle" letter-spacing="1">v1.5.0 RELEASE</text>
    </g>

    <g transform="translate(145, 0)">
      <rect width="170" height="30" rx="15" fill="#34C759" fill-opacity="0.15" stroke="#34C759" stroke-width="1.5"/>
      <text x="85" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#34C759" text-anchor="middle" letter-spacing="0.8">100% POSIX ENGINE</text>
    </g>

    <g transform="translate(330, 0)">
      <rect width="175" height="30" rx="15" fill="#64D2FF" fill-opacity="0.15" stroke="#64D2FF" stroke-width="1.5"/>
      <text x="87" y="20" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#64D2FF" text-anchor="middle" letter-spacing="0.8">SDK 28 W^X SAFE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="100" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="bold" fill="#FFFFFF" letter-spacing="3">MADMAX</text>

    <!-- Tagline -->
    <text x="0" y="142" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#EDEDF4" letter-spacing="0.5">Next-Gen Android Terminal &amp; Linux AI Environment</text>

    <!-- Sub-description -->
    <text x="0" y="174" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#9595A5" letter-spacing="0.2">Material Design 3 • Monet Theming • Offline Command Intelligence • Spotlight Palette</text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 208)">
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#181822" stroke="#2C2C3C" stroke-width="1"/>
        <text x="69" y="22" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#E2E2EA" text-anchor="middle">Material Design 3</text>
      </g>

      <g transform="translate(148, 0)">
        <rect width="130" height="34" rx="8" fill="#181822" stroke="#2C2C3C" stroke-width="1"/>
        <text x="65" y="22" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#E2E2EA" text-anchor="middle">Monet Theming</text>
      </g>

      <g transform="translate(288, 0)">
        <rect width="145" height="34" rx="8" fill="#181822" stroke="#2C2C3C" stroke-width="1"/>
        <text x="72" y="22" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#E2E2EA" text-anchor="middle">Offline AI Engine</text>
      </g>

      <g transform="translate(443, 0)">
        <rect width="145" height="34" rx="8" fill="#181822" stroke="#2C2C3C" stroke-width="1"/>
        <text x="72" y="22" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#E2E2EA" text-anchor="middle">Command Palette</text>
      </g>

      <g transform="translate(598, 0)">
        <rect width="120" height="34" rx="8" fill="#181822" stroke="#2C2C3C" stroke-width="1"/>
        <text x="60" y="22" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#E2E2EA" text-anchor="middle">8 Themes</text>
      </g>
    </g>
  </g>
</svg>