name: MadMax Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Release/Debug APKs
        run: ./gradlew assembleDebug

      - name: Generate Checksums
        id: checksums
        run: |
          cd app/build/outputs/apk/debug/
          sha256sum *.apk > SHA256SUMS.txt
          echo "checksums_path=app/build/outputs/apk/debug/SHA256SUMS.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-dev') || contains(github.ref, '-beta') }}
          generate_release_notes: true
